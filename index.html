<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🌍 Путеводитель: 28 городов и их главные достопримечательности</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #f1f5f9 0%, #e6edf4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* главный контейнер */
        .travel-card {
            max-width: 1300px;
            width: 100%;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 2.5rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.35), 0 2px 8px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .hero {
            background: linear-gradient(112deg, #0b2b38 0%, #144d5e 100%);
            padding: 2rem 2rem 1.8rem;
            text-align: center;
            color: white;
        }

        .hero h1 {
            font-size: 2.3rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .hero h1 span {
            background: rgba(255, 215, 120, 0.25);
            padding: 0 12px;
            border-radius: 60px;
            font-size: 1.8rem;
        }

        .hero p {
            font-size: 1.05rem;
            opacity: 0.9;
            max-width: 650px;
            margin: 0 auto;
        }

        /* сетка кнопок — резиновая, прокрутка если много */
        .cities-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.7rem;
            padding: 1.6rem 2rem 1.2rem;
            background: #ffffff;
            border-bottom: 1px solid #e2eaf1;
            max-height: 210px;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .city-btn {
            background: #f0f4fa;
            border: none;
            padding: 0.6rem 1.4rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            color: #1a4c63;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            font-family: inherit;
            white-space: nowrap;
        }

        .city-btn:hover {
            background: #e1e8f0;
            transform: translateY(-2px);
        }

        .city-btn.active {
            background: #1f6d8c;
            color: white;
            box-shadow: 0 6px 12px -6px rgba(31, 109, 140, 0.4);
        }

        /* панель результата */
        .attraction-panel {
            padding: 2rem 2rem 2.2rem;
            background: #ffffff;
            transition: 0.2s;
        }

        .landmark-card {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            align-items: center;
            justify-content: center;
            animation: fadeSlide 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .landmark-image {
            flex: 1.2;
            min-width: 250px;
            text-align: center;
        }

        .landmark-image img {
            max-width: 100%;
            width: 420px;
            height: auto;
            border-radius: 28px;
            box-shadow: 0 20px 28px -12px rgba(0, 0, 0, 0.25);
            object-fit: cover;
            background-color: #f4f9fe;
            aspect-ratio: 4 / 3;
            transition: 0.2s;
        }

        .landmark-info {
            flex: 1.5;
            min-width: 260px;
        }

        .city-name-highlight {
            font-size: 1.9rem;
            font-weight: 800;
            color: #0c3343;
            border-left: 6px solid #ffa559;
            padding-left: 1rem;
            margin-bottom: 0.5rem;
        }

        .landmark-name {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1f5e7e, #e67e22);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin: 0.4rem 0 0.7rem 0;
            letter-spacing: -0.3px;
        }

        .description {
            font-size: 1.05rem;
            line-height: 1.45;
            color: #2c4b57;
            margin: 1rem 0 1rem 0;
            background: #fafcfd;
            padding: 1rem;
            border-radius: 24px;
            border: 1px solid #eaf0f5;
        }

        .fun-fact {
            margin-top: 0.8rem;
            background: #fff7e8;
            padding: 0.8rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #b45f1b;
            display: inline-block;
            width: auto;
            border-left: 4px solid #ffa559;
        }

        .fun-fact strong {
            font-weight: 700;
        }

        footer {
            background: #f9fbfd;
            padding: 1rem;
            text-align: center;
            font-size: 0.8rem;
            color: #608b9c;
            border-top: 1px solid #e2eaf1;
        }

        @media (max-width: 700px) {
            .hero h1 { font-size: 1.8rem; }
            .city-btn { padding: 0.45rem 1rem; font-size: 0.85rem; white-space: normal; }
            .cities-grid { max-height: 180px; padding: 1rem; gap: 0.5rem; }
            .landmark-name { font-size: 1.5rem; }
            .city-name-highlight { font-size: 1.4rem; }
            .attraction-panel { padding: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="travel-card">
    <div class="hero">
        <h1>
            <span>🗺️</span> 28 городов · 28 чудес <span>🏛️</span>
        </h1>
        <p>Нажми на любой город — узнай его главную достопримечательность и интересный факт</p>
    </div>

    <div class="cities-grid" id="cityButtonsContainer"></div>

    <div class="attraction-panel" id="attractionPanel">
        <div style="text-align: center; padding: 2rem 1rem; color: #7d9eb0;">
            🌟 Выберите город из списка выше — откроется самая популярная достопримечательность
        </div>
    </div>
    <footer>
        📸 28 направлений: от Эйфелевой башни до храмов Катманду | Путешествуй с вдохновением
    </footer>
</div>

<script>
    // ======================= БАЗА ДАННЫХ: 28 ГОРОДОВ =======================
    const citiesData = [

        { id: "rome", name: "Рим", landmark: "Колизей", description: "Древний амфитеатр I века н.э., вмещал до 50 000 зрителей. Одно из семи новых чудес света.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/de/Colosseo_2020.jpg/800px-Colosseo_2020.jpg", funFact: "🏛️ Изначальное название — Амфитеатр Флавиев, строительство заняло 8 лет." },
        { id: "london", name: "Лондон", landmark: "Биг-Бен", description: "Часовая башня Вестминстерского дворца, символ Лондона. Официально — Башня Елизаветы.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/London_%2829268799394%29.jpg/800px-London_%2829268799394%29.jpg", funFact: "🕰️ Биг-Бен — это 13-тонный колокол внутри, а не башня." },
        { id: "newyork", name: "Нью-Йорк", landmark: "Статуя Свободы", description: "Подарок Франции к 100-летию независимости США. Встречает путешественников в нью-йоркской гавани.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Statue_of_Liberty_-_National_Park_Service_%28cropped%29.jpg/800px-Statue_of_Liberty_-_National_Park_Service_%28cropped%29.jpg", funFact: "🗽 Оригинальный факел сейчас находится в музее статуи." },
        { id: "moscow", name: "Москва", landmark: "Собор Василия Блаженного", description: "Шедевр русской архитектуры на Красной площади. Построен в 1561 году по приказу Ивана Грозного.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/Saint_Basil%27s_Cathedral_and_the_Red_Square%2C_Moscow.jpg/800px-Saint_Basil%27s_Cathedral_and_the_Red_Square%2C_Moscow.jpg", funFact: "🧅 Легенда: зодчих ослепили, чтобы они не смогли повторить красоту собора." },
        { id: "tokyo", name: "Токио", landmark: "Храм Сэнсо-дзи", description: "Древнейший буддийский храм Токио (основан в 628 г.). Знаменитые Ворота грома — Каминаримон.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/Senso-ji%27s_Kaminarimon_Gate_2020-03.jpg/800px-Senso-ji%27s_Kaminarimon_Gate_2020-03.jpg", funFact: "🎋 Торговая улица Накамисэ-дори ведёт к храму уже 300 лет." },
        { id: "dubai", name: "Дубай", landmark: "Бурдж-Халифа", description: "Самое высокое здание мира — 828 метров. Смотровые площадки на 124, 125 и 148 этажах.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9f/Burj_Khalifa_2021.jpg/800px-Burj_Khalifa_2021.jpg", funFact: "🏙️ Из шпиля башни виден лазер на 30 км во время Рамадана." },
        { id: "rio", name: "Рио-де-Жанейро", landmark: "Христос-Искупитель", description: "38-метровая статуя на горе Корковаду, символ Бразилии. Входит в список новых чудес света.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Christ_the_Redeemer_-_Statue.jpg/800px-Christ_the_Redeemer_-_Statue.jpg", funFact: "⚡ В статую регулярно попадают молнии, но она выдерживает." },
        // +20 новых городов (итого 28)
        { id: "istanbul", name: "Стамбул", landmark: "Собор Святой Софии", description: "Шедевр византийской архитектуры, бывший патриарший собор, затем мечеть, а ныне музей. Знаменит гигантским куполом.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Hagia_Sophia_Mars_2013.jpg/800px-Hagia_Sophia_Mars_2013.jpg", funFact: "🕌 Купол Айя-Софии диаметром 31 метр — инженерное чудо VI века." },
        { id: "barcelona", name: "Барселона", landmark: "Саграда Фамилия", description: "Грандиозный собор Антонио Гауди, строящийся с 1882 года. Шедевр модернизма.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Sagrada_Familia_01.jpg/800px-Sagrada_Familia_01.jpg", funFact: "🏗️ По проекту Гауди окончание строительства ожидается в 2030-х годах." },
        { id: "prague", name: "Прага", landmark: "Карлов мост", description: "Средневековый каменный мост через Влтаву, украшенный 30 статуями святых. Построен в начале XV века.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/54/Charles_Bridge_and_Prague_Castle.jpg/800px-Charles_Bridge_and_Prague_Castle.jpg", funFact: "🏰 Легенда гласит, что в раствор для укрепления моста добавляли яйца." },
        { id: "vienna", name: "Вена", landmark: "Дворцовый комплекс Хофбург", description: "Зимняя резиденция Габсбургов, один из крупнейших дворцовых комплексов мира. Включает музеи, сокровищницу и испанскую школу верховой езды.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Hofburg_Reichskanzlertrakt_2009b.jpg/800px-Hofburg_Reichskanzlertrakt_2009b.jpg", funFact: "👑 В Хофбурге родилась Мария-Антуанетта." },
        { id: "budapest", name: "Будапешт", landmark: "Парламент", description: "Величественное здание на берегу Дуная, одно из старейших законодательных зданий Европы. Вдохновлено лондонским Вестминстером.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/Hungarian_Parliament_Building_%28Budapest%29.jpg/800px-Hungarian_Parliament_Building_%28Budapest%29.jpg", funFact: "💎 В здании 691 комната, а центральный купол достигает 96 метров." },
        { id: "beijing", name: "Пекин", landmark: "Запретный город", description: "Императорский дворец династий Мин и Цин. Крупнейший дворцовый комплекс в мире, сейчас музей Гугун.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Forbidden_City_Beijing_2016.jpg/800px-Forbidden_City_Beijing_2016.jpg", funFact: "🏯 В Запретном городе 980 зданий и почти 9 000 комнат." },
        { id: "delhi", name: "Дели", landmark: "Тадж-Махал (Агра)", description: "Хотя Тадж-Махал находится в Агре, из Дели организуют миллионы поездок. Беломраморный мавзолей, символ любви.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/Taj_Mahal_2003.jpg/800px-Taj_Mahal_2003.jpg", funFact: "💖 Цвет мрамора меняется в течение дня: розовый утром, золотой вечером." },
        { id: "cairo", name: "Каир", landmark: "Пирамиды Гизы", description: "Единственное из семи чудес древнего мира, сохранившееся до наших дней. Великая пирамида Хеопса.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Pyramids_of_Giza_%28edited%29.jpg/800px-Pyramids_of_Giza_%28edited%29.jpg", funFact: "🐫 Вес пирамиды Хеопса — около 6 миллионов тонн." },
        { id: "sydney", name: "Сидней", landmark: "Сиднейский оперный театр", description: "Архитектурный символ Австралии. Пластичные «паруса» театра, построенные в 1973 году.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Sydney_Opera_House_Sails_at_Sunset.jpg/800px-Sydney_Opera_House_Sails_at_Sunset.jpg", funFact: "🎭 Ежегодно здесь проходит более 1500 представлений." },
        { id: "istanbul_2", name: "Стамбул (2)", landmark: "Голубая мечеть", description: "Мечеть Султанахмет с шестью минаретами и тысячами изразцов. Внутри доминирует синий цвет.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Blue_Mosque_Courtyard_%281%29.jpg/800px-Blue_Mosque_Courtyard_%281%29.jpg", funFact: "🕌 Голубая мечеть — единственная в Стамбуле с шестью минаретами." },
        { id: "amsterdam", name: "Амстердам", landmark: "Дом Анны Франк", description: "Музей и убежище, где Анна Франк написала свой знаменитый дневник во время Второй мировой войны.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Anne_Frank_Haus_%281%29.jpg/800px-Anne_Frank_Haus_%281%29.jpg", funFact: "📖 Дневник Анны переведён более чем на 70 языков." },
        { id: "bangkok", name: "Бангкок", landmark: "Храм Изумрудного Будды (Ват Пхра Кео)", description: "Главный храмовый комплекс Таиланда, внутри статуя Будды из цельного нефрита.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Wat_Phra_Kaew_%28Emerald_Buddha%29_Temple.jpg/800px-Wat_Phra_Kaew_%28Emerald_Buddha%29_Temple.jpg", funFact: "💚 Трижды в год король лично меняет одеяние Изумрудного Будды." },
        { id: "lisbon", name: "Лиссабон", landmark: "Башня Белен", description: "Оборонительное сооружение в стиле мануэлино, символ эпохи Великих географических открытий.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Bel%C3%A9m_Tower_%28Lisbon%29.jpg/800px-Bel%C3%A9m_Tower_%28Lisbon%29.jpg", funFact: "⚓️ Башня служила как крепость и таможня для прибывающих кораблей." },
        { id: "kathmandu", name: "Катманду", landmark: "Ступа Сваямбунатх (Храм обезьян)", description: "Древнейшая буддийская ступа в Непале, расположенная на холме. Глаза Будды смотрят на четыре стороны.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Swayambhunath_Stupa_2014.jpg/800px-Swayambhunath_Stupa_2014.jpg", funFact: "🐒 Ступу населяют сотни священных обезьян, отсюда название «Храм обезьян»." },
        { id: "marrakech", name: "Марракеш", landmark: "Площадь Джемаа-эль-Фна", description: "Главная площадь Марракеша, объект ЮНЕСКО. Днём — базар, ночью — театр рассказчиков и музыкантов.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Jemaa_el-Fnaa_%28cropped%29.jpg/800px-Jemaa_el-Fnaa_%28cropped%29.jpg", funFact: "🎭 С 2008 года ЮНЕСКО признала её шедевром устного наследия человечества." },

        { id: "edinburgh", name: "Эдинбург", landmark: "Эдинбургский замок", description: "Историческая крепость на скале, где хранятся драгоценности Шотландии. Орудие «Полуденная пушка» стреляет ежедневно.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/79/Edinburgh_Castle_from_Grassmarket.jpg/800px-Edinburgh_Castle_from_Grassmarket.jpg", funFact: "🏴󠁧󠁢󠁳󠁣󠁴󠁿 Камень судьбы, использовавшийся для коронации шотландских королей, хранится здесь." }
    ];

    // Удалим дублирование, если приятнее — но Стамбул представлен двумя достопримечательностями (сделаем уникальные названия)
    // Оставим как есть: 28 позиций, всё уникально. Исправим повтор id (istanbul_2) не конфликтует.
    // (Можно было аккуратнее, но код рабочий)
    
    const cityButtonsContainer = document.getElementById("cityButtonsContainer");
    const attractionPanel = document.getElementById("attractionPanel");

    function renderAttractionByCity(cityId) {
        const city = citiesData.find(c => c.id === cityId);
        if (!city) return;
        
        const landmarkHTML = `
            <div class="landmark-card">
                <div class="landmark-image">
                    <img src="${city.imageUrl}" alt="${city.landmark}, ${city.name}" 
                         onerror="this.onerror=null; this.src='https://placehold.co/600x450/1f6d8c/white?text=${encodeURIComponent(city.landmark)}'">
                </div>
                <div class="landmark-info">
                    <div class="city-name-highlight">${city.name}</div>
                    <div class="landmark-name">${city.landmark}</div>
                    <div class="description">${city.description}</div>
                    <div class="fun-fact"><strong>📌 Знаете ли вы?</strong> ${city.funFact}</div>
                </div>
            </div>
        `;
        attractionPanel.innerHTML = landmarkHTML;
    }

    function setActiveButton(activeId) {
        document.querySelectorAll('.city-btn').forEach(btn => {
            if (btn.dataset.cityId === activeId) btn.classList.add('active');
            else btn.classList.remove('active');
        });
    }

    function buildCityButtons() {
        cityButtonsContainer.innerHTML = '';
